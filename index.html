<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Queens Puzzle</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f5f4f0;display:flex;justify-content:center;padding:1.5rem 1rem;min-height:100vh}
  #app{width:100%;max-width:520px}
  #header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem}
  #title-row{font-size:20px;font-weight:600;color:#1a1a1a}
  #subtitle{font-size:12px;color:#666;margin-top:2px}
  #controls{display:flex;gap:8px;flex-shrink:0}
  button{cursor:pointer;font-size:13px;padding:6px 13px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;transition:background .15s;-webkit-tap-highlight-color:transparent}
  button:hover{background:#f0f0f0}
  button:disabled{opacity:.45;cursor:default}
  #size-row{display:flex;gap:6px;justify-content:center;margin-bottom:0.75rem}
  .size-btn{font-size:12px;padding:5px 14px}
  .size-btn.active{background:#e8e8e8;border-color:#888;font-weight:600}
  #grid-wrap{display:flex;justify-content:center;align-items:center;min-height:280px;margin:0.5rem 0}
  #spinner{display:flex;flex-direction:column;align-items:center;gap:12px;color:#888;font-size:13px}
  .ring{width:34px;height:34px;border:3px solid #ddd;border-top-color:#666;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #grid{display:none;border:2px solid #222;border-radius:6px;overflow:hidden;user-select:none;touch-action:manipulation}
  .cell{display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
  .cell:active{filter:brightness(0.88)}
  .cell.error{outline:3px solid #e24b4a;outline-offset:-3px;z-index:2}
  .cell.crown::after{content:'♛';color:#1a1a1a;line-height:1;position:relative;z-index:1}
  .cell.mark::after{content:'✕';color:rgba(0,0,0,0.38);font-weight:700;line-height:1;position:relative;z-index:1}
  #win-banner{display:none;text-align:center;padding:.9rem;background:#d4e6a5;border-radius:10px;font-size:16px;font-weight:600;color:#3b6d11;margin-bottom:.75rem}
  #instructions{background:#fff;border-radius:10px;padding:.9rem 1.1rem;margin-top:.75rem;font-size:13px;color:#555;line-height:1.65;border:1px solid #e0e0e0}
  #instructions strong{color:#1a1a1a;font-weight:600}
  #instructions ul{margin:.35rem 0 0;padding-left:1.15rem}
  #instructions li{margin-bottom:2px}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div>
      <div id="title-row">Queens</div>
      <div id="subtitle">One crown per row, column & color region</div>
    </div>
    <div id="controls">
      <button id="btn-new" onclick="newPuzzle()">New</button>
      <button id="btn-reset" onclick="resetBoard()">Reset</button>
    </div>
  </div>
  <div id="size-row">
    <button class="size-btn active" onclick="setSize(8,this)">8×8</button>
    <button class="size-btn" onclick="setSize(9,this)">9×9</button>
  </div>
  <div id="win-banner">🎉 Solved! Well done!</div>
  <div id="grid-wrap">
    <div id="spinner"><div class="ring"></div>Generating puzzle…</div>
    <div id="grid"></div>
  </div>
  <div id="instructions">
    <strong>How to play:</strong> tap once to mark <strong>✕</strong>, again for a crown <strong>♛</strong>, once more to clear.<br><br>
    <strong>Rules:</strong>
    <ul>
      <li>One crown per <strong>row</strong></li>
      <li>One crown per <strong>column</strong></li>
      <li>One crown per <strong>color region</strong></li>
      <li>No two crowns may <strong>touch</strong> — even diagonally</li>
    </ul>
  </div>
</div>
<script>
const PALETTE = [
  '#F28B82','#FAD199','#AECBFA','#D7AEFB',
  '#A8D5A2','#FF8C69','#81D4E8','#F6C0E0','#B5EAD7'
];
const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
let N = 8, regions = [], cells = [], genId = 0;

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function computeCellSize(n){
  const available = Math.min(window.innerWidth, 520) - 36;
  return Math.min(Math.floor(available/n), n===8?56:50);
}

// Region border logic:
// For each edge of a cell, draw a thick border if the neighbor is a different region,
// otherwise draw a hair-line inner grid line.
const THICK = '1.5px solid #1a1a1a';
const THIN  = '0.5px solid rgba(0,0,0,0.12)';

function regionBorderStyle(r, c, n, rg) {
  const top    = r === 0   || rg[r-1][c] !== rg[r][c] ? THICK : THIN;
  const bottom = r === n-1 || rg[r+1][c] !== rg[r][c] ? THICK : THIN;
  const left   = c === 0   || rg[r][c-1] !== rg[r][c] ? THICK : THIN;
  const right  = c === n-1 || rg[r][c+1] !== rg[r][c] ? THICK : THIN;
  return `border-top:${top};border-bottom:${bottom};border-left:${left};border-right:${right};`;
}

function genSolution(n){
  for(let t=0;t<50000;t++){
    const cols=shuffle([...Array(n).keys()]);
    let ok=true;
    for(let i=0;i<n&&ok;i++) for(let j=i+1;j<n&&ok;j++)
      if(Math.abs(i-j)<=1&&Math.abs(cols[i]-cols[j])<=1) ok=false;
    if(ok) return cols;
  }
  return null;
}

function buildRegions(sol,n){
  const g=Array.from({length:n},()=>Array(n).fill(-1));
  sol.forEach((c,r)=>g[r][c]=r);
  let rem=shuffle(Array.from({length:n*n},(_,i)=>[0|i/n,i%n]).filter(([r,c])=>g[r][c]===-1));
  for(let pass=0;pass<40&&rem.length;pass++){
    const left=[];
    for(const[r,c]of shuffle(rem)){
      const cands=[];
      for(const[dr,dc]of DIRS){
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<n&&nc>=0&&nc<n&&g[nr][nc]!==-1){
          const reg=g[nr][nc];
          const dist=Math.abs(r-reg)+Math.abs(c-sol[reg]);
          const cross=reg!==r?2:0;
          cands.push({reg,w:dist+cross+Math.random()*2});
        }
      }
      if(!cands.length){left.push([r,c]);continue;}
      cands.sort((a,b)=>b.w-a.w);
      g[r][c]=cands[0].reg;
    }
    rem=left;
  }
  if(rem.length) return null;
  for(let reg=0;reg<n;reg++){
    const cs=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(g[r][c]===reg)cs.push([r,c]);
    if(!cs.length) return null;
    const vis=new Set([cs[0].join()]);const q=[cs[0]];
    while(q.length){
      const[cr,cc]=q.shift();
      for(const[dr,dc]of DIRS){
        const nr=cr+dr,nc=cc+dc,k=`${nr},${nc}`;
        if(nr>=0&&nr<n&&nc>=0&&nc<n&&g[nr][nc]===reg&&!vis.has(k)){vis.add(k);q.push([nr,nc]);}
      }
    }
    if(vis.size!==cs.length) return null;
  }
  return g;
}

function countSolutions(rg,n){
  let count=0;
  const placed=new Int8Array(n).fill(-1),usedC=new Uint8Array(n),usedR=new Uint8Array(n);
  const flat=new Uint8Array(n*n);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)flat[r*n+c]=rg[r][c];
  function bt(row){
    if(count>=2)return;
    if(row===n){count++;return;}
    const prev=row>0?placed[row-1]:-99;
    for(let c=0;c<n;c++){
      if(usedC[c]||usedR[flat[row*n+c]])continue;
      if(Math.abs(prev-c)<=1)continue;
      placed[row]=c;usedC[c]=1;usedR[flat[row*n+c]]=1;
      bt(row+1);
      placed[row]=-1;usedC[c]=0;usedR[flat[row*n+c]]=0;
    }
  }
  bt(0);return count;
}

function tryBatch(n,batchSize){
  for(let i=0;i<batchSize;i++){
    const sol=genSolution(n);if(!sol)continue;
    const rg=buildRegions(sol,n);if(!rg)continue;
    if(countSolutions(rg,n)===1)return rg;
  }
  return null;
}

function showSpinner(on){
  document.getElementById('spinner').style.display=on?'flex':'none';
  document.getElementById('grid').style.display=on?'none':'grid';
  document.getElementById('btn-new').disabled=on;
  document.getElementById('btn-reset').disabled=on;
}

function newPuzzle(){
  document.getElementById('win-banner').style.display='none';
  showSpinner(true);
  const id=++genId;
  function attempt(){
    if(genId!==id)return;
    const regs=tryBatch(N,40);
    if(regs){
      regions=regs;
      cells=Array.from({length:N},()=>Array(N).fill(0));
      showSpinner(false);
      renderGrid();
    } else {
      setTimeout(attempt,0);
    }
  }
  setTimeout(attempt,40);
}

function resetBoard(){
  document.getElementById('win-banner').style.display='none';
  cells=Array.from({length:N},()=>Array(N).fill(0));
  renderGrid();
}

function setSize(n,btn){
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  N=n;newPuzzle();
}

function renderGrid(){
  const sz=computeCellSize(N);
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns=`repeat(${N},${sz}px)`;
  g.innerHTML='';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const el=document.createElement('div');
    const s=cells[r][c];
    el.className='cell'+(s===1?' mark':s===2?' crown':'');
    el.style.cssText=
      `width:${sz}px;height:${sz}px;`+
      `background:${PALETTE[regions[r][c]]};`+
      `font-size:${Math.round(sz*0.46)}px;`+
      regionBorderStyle(r,c,N,regions);
    el.dataset.r=r;el.dataset.c=c;
    el.onclick=()=>{cells[r][c]=(cells[r][c]+1)%3;renderGrid();checkWin();};
    g.appendChild(el);
  }
  highlightErrors();
}

window.addEventListener('resize',()=>{ if(regions.length) renderGrid(); });

function getErrors(){
  const e=new Set();
  const cr=(r,c)=>cells[r][c]===2;
  for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)if(cr(r,c))row.push([r,c]);if(row.length>1)row.forEach(([a,b])=>e.add(`${a},${b}`));}
  for(let c=0;c<N;c++){const col=[];for(let r=0;r<N;r++)if(cr(r,c))col.push([r,c]);if(col.length>1)col.forEach(([a,b])=>e.add(`${a},${b}`));}
  const rc={};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(cr(r,c)){const rg=regions[r][c];if(!rc[rg])rc[rg]=[];rc[rg].push([r,c]);}
  Object.values(rc).forEach(a=>{if(a.length>1)a.forEach(([a,b])=>e.add(`${a},${b}`));});
  const all=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(cr(r,c))all.push([r,c]);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const[r1,c1]=all[i],[r2,c2]=all[j];
    if(Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1){e.add(`${r1},${c1}`);e.add(`${r2},${c2}`);}
  }
  return e;
}

function highlightErrors(){
  const e=getErrors();
  document.querySelectorAll('.cell').forEach(el=>
    el.classList.toggle('error',e.has(`${el.dataset.r},${el.dataset.c}`)));
}

function checkWin(){
  if(cells.flat().filter(v=>v===2).length===N&&getErrors().size===0)
    document.getElementById('win-banner').style.display='block';
}

newPuzzle();
</script>
</body>
</html>
